name: build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, test and package
        run: ./gradlew build jar
      - name: Smoke test the exported jar (opens the window, takes a snapshot, exits)
        run: |
          mkdir fresh && cp build/libs/httyd-battle.jar fresh/
          cd fresh && java -jar httyd-battle.jar --smoke
      - uses: actions/upload-artifact@v4
        with:
          name: httyd-battle-${{ matrix.os }}
          path: build/libs/httyd-battle.jar
